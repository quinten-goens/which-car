<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How this website was made – GOCA Barometer</title>
<meta name="description" content="How the GOCA Barometer dashboard was made: data source, polite scraping, scoring method, hosting, and the use of Claude Code.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%229%22 width=%224%22 height=%226%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3Crect x=%226%22 y=%225%22 width=%224%22 height=%2210%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3Crect x=%2211%22 y=%221%22 width=%224%22 height=%2214%22 rx=%221%22 fill=%22%23e34948%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="common.js"></script>
</head>
<body data-page="about" data-title-key="about_title">
<div class="wrap">
  <div class="topbar" id="topbar"></div>
  <article class="card prose">
    <h1 data-i="about_title"></h1>
    <div id="aboutBody"></div>
  </article>
</div>
<script>
// Fill in the figures from data.json; the page still reads fine without them.
(function () {
  let meta = null;
  function render() {
    const fmt = (v) => (v == null ? "…" : Math.round(v).toLocaleString(LOCALE()));
    let period = "…";
    if (meta) {
      const months = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
      const m = meta.period.match(/(\p{L}+)\s+(\d{4})\s*[–-]\s*(\p{L}+)\s+(\d{4})/u);
      if (m) {
        const f = (mon, y) => new Date(+y, months.indexOf(mon.toLowerCase()), 1).toLocaleDateString(LOCALE(), { month: "long", year: "numeric" });
        period = t("period_fmt", { from: f(m[1], m[2]), to: f(m[3], m[4]) });
      }
    }
    document.getElementById("aboutBody").innerHTML = t("about_body", {
      n: fmt(meta?.total_inspections), m: meta ? meta.models.length : "…", period: esc(period), d: esc(meta?.scraped_at ?? "…"),
    });
  }
  document.addEventListener("DOMContentLoaded", () => {
    render(); onLang(render);
    fetch("data.json").then((r) => r.json()).then((d) => { meta = d; render(); }).catch(() => {});
  });
})();
</script>
</body>
</html>
