<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Which car to buy? – GOCA Barometer</title>
<meta name="description" content="Which used car models and brands have the fewest defects at the Flemish technical inspection, compared with cars of the same age. NL / FR / DE / EN.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="GOCA Barometer dashboard">
<meta property="og:title" content="Which car to buy? – GOCA Barometer">
<meta property="og:description" content="Which used car models and brands have the fewest defects at the Flemish technical inspection, compared with cars of the same age. Based on 2 million inspections. NL / FR / DE / EN.">
<meta property="og:url" content="http://quinten.goens.dev/which-car/">
<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Which car to buy? – GOCA Barometer">
<meta name="twitter:description" content="Which used car models and brands have the fewest defects at the Flemish technical inspection, compared with cars of the same age. Based on 2 million inspections. NL / FR / DE / EN.">
<link rel="canonical" href="http://quinten.goens.dev/which-car/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect x=%221%22 y=%229%22 width=%224%22 height=%226%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3Crect x=%226%22 y=%225%22 width=%224%22 height=%2210%22 rx=%221%22 fill=%22%232a78d6%22/%3E%3Crect x=%2211%22 y=%221%22 width=%224%22 height=%2214%22 rx=%221%22 fill=%22%23e34948%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script src="i18n.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</head>
<body data-page="dashboard" data-title-key="title">
<div class="wrap">
  <div class="topbar" id="topbar"></div>

  <h1 data-i="title"></h1>
  <p class="lede"><span data-i="lede"></span> <span data-i="data_from"></span>: <a href="https://gocabarometer.gocavlaanderen.be/" target="_blank" rel="noopener">GOCA Barometer</a> <span id="period"></span>.</p>
  <ol class="steps">
    <li data-i="step1"></li>
    <li data-i="step2"></li>
    <li data-i="step3"></li>
  </ol>

  <div class="tabs-main" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true" data-i="tab_overview"></button>
    <button role="tab" data-tab="h2h" aria-selected="false" data-i="tab_h2h"></button>
  </div>

  <div class="controls" role="group">
    <div class="grp"><span class="lbl" data-i="f_age"></span><span data-tip-static="i_f_age"></span><span class="chips" id="ageChips"></span></div>
    <div class="grp ov-only"><label for="minBrand" data-i="f_min"></label><input type="number" id="minBrand" min="1" max="20" value="3"><span class="lbl" data-i="f_min_suffix"></span><span data-tip-static="i_f_min"></span></div>
    <div class="grp ov-only"><label for="search" data-i="f_find"></label><input type="search" id="search" data-i-ph="f_find_ph"><span data-tip-static="i_f_find"></span></div>
  </div>

  <!-- ================= overview tab ================= -->
  <div id="overview">
    <div class="tiles" id="tiles"></div>

    <div class="grid2">
      <section class="card">
        <h2><span data-i="brands_h"></span><span data-tip-static="i_brands"></span></h2>
        <p class="sub" data-i="brands_sub"></p>
        <div class="legend"><span><i class="sq" style="background:var(--better)"></i><span data-i="leg_better"></span></span><span><i class="sq" style="background:var(--worse)"></i><span data-i="leg_worse"></span></span></div>
        <div class="scroll" id="brandChart"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2 id="bestHead"></h2><span class="seg" role="group" id="bestToggle"></span></div>
        <p class="sub" id="bestSub"></p>
        <div class="best" id="bestList"></div>
      </section>
    </div>

    <section class="card" id="modelsCard">
      <h2><span data-i="models_h"></span><span data-tip-static="i_models"></span></h2>
      <p class="sub" data-i="models_sub"></p>
      <div class="legend">
        <span><i class="sq" style="background:rgba(var(--better-tint),.7)"></i><span data-i="leg_better"></span></span>
        <span><i class="sq" style="background:var(--mid);border:1px solid var(--border)"></i><span data-i="leg_avg"></span></span>
        <span><i class="sq" style="background:rgba(var(--worse-tint),.7)"></i><span data-i="leg_worse"></span></span>
        <span><span data-i="leg_na"></span><span data-tip-static="i_na"></span></span>
      </div>
      <div class="tablebox scroll"><table id="modelTable"></table></div>
    </section>

  </div>

  <!-- ================= head-to-head tab ================= -->
  <div id="h2h" hidden></div>

  <section class="card">
    <details>
      <summary data-i="how_h"></summary>
      <div data-i="how_body"></div>
    </details>
  </section>

  <footer><span id="footer"></span> · <a href="about.html" data-i="nav_about"></a></footer>
</div>
<div id="tray" class="tray" hidden aria-live="polite"></div>
</body>
</html>
